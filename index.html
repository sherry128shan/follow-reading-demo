<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>跟读练习交互演示</title><style>
*{box-sizing:border-box}body{margin:0;background:#e8edf0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#222}button{font:inherit;cursor:pointer}.phone{max-width:430px;min-height:100dvh;margin:auto;background:#fff;position:relative;overflow:hidden;box-shadow:0 5px 35px #a8b5be55}.hero{height:43vh;min-height:290px;background:linear-gradient(#58a9e6,#acd9f1 72%,#f8fbfc);position:relative;text-align:center;display:flex;align-items:center;justify-content:center;flex-direction:column}.back,.submit{position:absolute;top:18px;border:0;color:white;background:#0005;border-radius:20px;padding:8px 14px}.back{left:16px}.submit{right:16px}.hero h1{color:white;text-shadow:-2px -2px #333,2px 2px #333,2px -2px #333,-2px 2px #333;font-size:25px;margin:20px 0 0}.panda{font-size:130px;line-height:1.2;filter:drop-shadow(0 8px 3px #52657844)}.vip{background:#f4dfb7;color:#876736;text-align:center;padding:12px;font-size:13px;border-radius:20px 20px 0 0;margin-top:-12px;position:relative}.guide{position:absolute;bottom:8px;left:15px;background:white;border:3px solid #86d9c8;border-radius:25px;padding:9px 16px;color:#51bea9;font-weight:700;box-shadow:0 5px 20px #4443;z-index:2}.guide.hide{opacity:0;pointer-events:none}.guide{transition:opacity .4s}.word.guide-word{animation:pulse .7s ease-in-out 4 alternate}@keyframes pulse{to{box-shadow:0 0 0 5px #80dfcba8}}.sentences{padding:16px 20px;height:210px;overflow:auto}.row{display:flex;align-items:center;min-height:42px;border-radius:8px;color:#b5b5b5;font-weight:650}.row.current{background:#daf4ee;color:#333}.row.current.has-problems{background:#f9e6e6}.number{width:45px;text-align:center;border-right:2px solid white;flex:none}.words{flex:1;text-align:center;padding:3px}.word{border:0;border-radius:9px;background:#fff;color:#222;padding:6px 9px;margin:2px;font-weight:650}.word.selected{background:#62c6b1;color:white}.word.scored-bad{color:#e95d54}.word.problem{color:#e95d54;outline:1px solid #e95d54}.word.problem.selected{background:#e95d54;color:white}.pastbad{color:#e65c54}.controls{display:flex;justify-content:space-evenly;align-items:end;padding:18px 15px 30px}.control{border:0;background:none;color:#999;font-size:13px;display:flex;align-items:center;gap:8px;flex-direction:column}.circle{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:#ddf6f0;color:#60c8b2;font-size:23px}.main .circle{width:64px;height:64px;background:#62c9b3;color:white;font-size:29px}.control:disabled .circle{background:#e3e3e3;color:#aaa}.hint{text-align:center;font-size:12px;color:#a0a7a6;padding:0 12px 18px}.overlay{position:absolute;inset:0;background:#0008;display:grid;place-items:center;z-index:5}.overlay[hidden]{display:none}.modal{width:78%;background:white;border-radius:24px;padding:28px;text-align:center;box-shadow:0 15px 35px #0002}.stars{font-size:36px;color:#ffc45c;letter-spacing:4px}.modal h2{margin:12px}.modal p{color:#8a9292}.modal button{border:0;border-radius:24px;background:#60c6b2;color:white;padding:11px 32px;font-weight:bold}.toast{position:absolute;bottom:110px;left:50%;transform:translateX(-50%);background:#263b38df;color:white;padding:10px 16px;border-radius:18px;font-size:13px;white-space:nowrap;z-index:4} .toast[hidden]{display:none}
</style></head><body><main class="phone"><section class="hero"><button class="back" onclick="toast('演示页面')">‹</button><button class="submit" onclick="submitWork()">提交</button><h1>Clean, Not Clean<br>干净，不干净</h1><div class="panda">🐼</div><div id="guide" class="guide">🐳 点点单词，单独练习！</div></section><div class="vip">VIP专属 | AI伴读陪宝贝自信开口</div><div id="sentences" class="sentences"></div><div class="controls"><button class="control" onclick="listen()"><span class="circle">◖))</span>听原声</button><button id="record" class="control main" onclick="record()"><span class="circle">♩</span><span id="recordLabel">跟读整句</span></button><button id="self" class="control" onclick="listenSelf()"><span class="circle">♬</span>听自己</button></div><div class="hint">点击单词听发音 · 录音和评分为模拟演示</div><div id="feedback" class="overlay" hidden><div class="modal"><div class="stars" id="stars">★★☆</div><h2 id="feedbackTitle">再试一次！</h2><p id="feedbackText">点点单词，再练一练吧</p><button onclick="closeFeedback()">继续</button></div></div><div id="toast" class="toast" hidden></div></main><script>
const lines=['Clean not clean','This bread is not clean','This spread is clean','This floor is not clean','My hands are not clean','Is your face clean','I wash my hands','Now I am clean','Clean clean clean'];let current=0,selected=null,recording=false,states=lines.map(()=>({read:false,bad:[],boxes:[],wordRecords:{},attempts:0})),pending=null;const $=id=>document.getElementById(id);let guideActive=!localStorage.getItem('followWordPractised') && Number(localStorage.getItem('followGuideCount')||0)<2;if(guideActive){localStorage.setItem('followGuideCount',Number(localStorage.getItem('followGuideCount')||0)+1)}else{$('guide').classList.add('hide')}let guideTimer=setTimeout(()=>$('guide').classList.add('hide'),6000);function hideGuide(){guideActive=false;$('guide').classList.add('hide');clearTimeout(guideTimer)}function stopAudio(){speechSynthesis.cancel()}function render(){let s=states[current];$('sentences').innerHTML=lines.map((line,i)=>{let words=line.split(' ');return `<div class="row ${i===current?'current':''} ${i===current&&states[i].bad.length?'has-problems':''}" onclick="changeSentence(${i})"><span class="number">${i+1}</span><span class="words">${i===current?words.map((w,j)=>`<button class="word ${selected===j?'selected':''} ${s.boxes.includes(j)||(s.bad.includes(j)&&selected===j)?'problem':''} ${s.bad.includes(j)&&!s.boxes.includes(j)&&selected!==j?'scored-bad':''} ${guideActive&&i===0&&j===0?'guide-word':''}" onclick="event.stopPropagation();selectWord(${j})">${w}</button>`).join(' '):words.map((w,j)=>`<span class="${states[i].bad.includes(j)?'pastbad':''}">${w}</span>`).join(' ')}</span></div>`}).join('');$('recordLabel').textContent=recording?'结束录音':selected!==null?'跟读单词':s.read&&s.bad.length?'再读整句':'跟读整句';$('self').disabled=selected!==null?!s.wordRecords[selected]:!s.read}
function changeSentence(i){if(recording){toast('录音中，请先结束录音');return}stopAudio();current=i;selected=null;render()}function selectWord(i){if(recording){toast('录音中，请先结束录音');return}hideGuide();stopAudio();selected=selected===i?null:i;render();if(selected!==null)listen()}function listen(){stopAudio();let text=selected===null?lines[current]:lines[current].split(' ')[selected];let u=new SpeechSynthesisUtterance(text);u.lang='en-US';speechSynthesis.speak(u);toast('播放原声')}function listenSelf(){toast('演示模式：暂无真实录音');}function record(){hideGuide();stopAudio();if(!recording){recording=true;render();toast('模拟录音中，再点一次结束');return}recording=false;let s=states[current];if(selected!==null){s.wordRecords[selected]=true;s.attempts++;localStorage.setItem('followWordPractised','1');s.boxes=s.boxes.filter(x=>x!==selected);pending='word';$('stars').textContent='★★★';$('feedbackTitle').textContent='读得真棒！';$('feedbackText').textContent='继续加油，你越来越棒啦';}else{let first=!s.read;s.read=true;s.bad=first?[Math.min(1,lines[current].split(' ').length-1)]:[];s.boxes=[...s.bad];pending='sentence';$('stars').textContent=first?'★★☆':'★★★';$('feedbackTitle').textContent=first?'再试一次！':'读得真棒！';$('feedbackText').textContent=first?'点点红框里的单词，再练一练吧':'你完成了整句跟读';}render();$('feedback').hidden=false;clearTimeout(window.feedbackTimer);window.feedbackTimer=setTimeout(closeFeedback,2500)}function closeFeedback(){clearTimeout(window.feedbackTimer);if($('feedback').hidden)return;$('feedback').hidden=true;if(pending==='word')selected=null;else if(pending==='sentence'&&!states[current].bad.length&&current<lines.length-1){current++;selected=null}pending=null;render();document.querySelector('.row.current')?.scrollIntoView({block:'nearest'})}function submitWork(){if(!states.some(s=>s.read)){toast('先完成至少一句整句跟读吧');return}toast('演示：作品已保存')}let tt;function toast(t){$('toast').textContent=t;$('toast').hidden=false;clearTimeout(tt);tt=setTimeout(()=>$('toast').hidden=true,2200)}render();
</script></body></html>
